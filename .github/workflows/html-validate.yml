name: HTML Validation

on:
  workflow_dispatch:

jobs:
  validate-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run HTMLHint
        run: |
          npm install -g htmlhint
          htmlhint index.html --rules alt-require,id-unique,tag-pair,attr-lowercase

  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --exclude "linkedin\.com" index.html
          fail: true
