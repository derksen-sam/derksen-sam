<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%230B2942'/><circle cx='16' cy='16' r='8' fill='%235EEAD4'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
</noscript>
<title>404 - Node not found</title>
<meta name="description" content="Page not found.">
<style>
  :root{
    --bg: #0B2942;
    --bg-panel: #0F3555;
    --bg-panel-2: #123c60;
    --line: rgba(234,242,248,0.12);
    --line-strong: rgba(234,242,248,0.22);
    --text: #EAF2F8;
    --text-muted: #B9CEDE;
    --accent: #5EEAD4;
    --accent-dim: #2E7C71;
    --amber: #F5A623;
    --font-display: 'JetBrains Mono', 'Courier New', monospace;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --radius: 3px;
  }

  *,*::before,*::after{ box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  body{
    margin:0;
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--bg);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 32px 32px;
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    padding: 1.5rem;
  }

  :focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .wrap{
    max-width: 560px;
    text-align:center;
  }

  .eyebrow{
    font-family: var(--font-display);
    font-size: 0.78rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--amber);
    display: inline-flex;
    align-items: center;
    gap: 0.6em;
    margin-bottom: 1.5rem;
  }
  .eyebrow::before{
    content: "";
    width: 0.6em;
    height: 0.6em;
    background: var(--amber);
    display: inline-block;
    border-radius: 1px;
  }

  h1{
    font-family: var(--font-display);
    font-size: clamp(2.5rem, 8vw, 4rem);
    margin: 0 0 0.5rem;
    letter-spacing: 0.02em;
  }

  p.lede{
    color: var(--text-muted);
    font-size: 1.05rem;
    max-width: 42ch;
    margin: 0 auto 2rem;
  }

  .diagram{
    width: 220px;
    height: auto;
    margin: 0 auto 2rem;
    display:block;
  }
  .diagram .link-line{
    stroke: var(--line-strong);
    stroke-width: 1.5;
    stroke-dasharray: 4 6;
    fill:none;
  }
  .diagram .node{
    fill: var(--bg-panel-2);
    stroke: var(--amber);
    stroke-width: 1.5;
  }
  .diagram .node.broken{
    stroke: var(--amber);
    stroke-dasharray: 3 3;
  }
  .diagram .x-mark{
    stroke: var(--amber);
    stroke-width: 2;
  }
  .diagram .node-label{
    font-family: var(--font-display);
    font-size: 9px;
    fill: var(--text-muted);
  }

  .btn{
    font-family: var(--font-display);
    font-size: 0.85rem;
    text-decoration: none;
    padding: 0.75rem 1.5rem;
    border-radius: var(--radius);
    display:inline-block;
    background: var(--accent);
    color: var(--bg);
    font-weight: 700;
  }
  .btn:hover{ background: #9BF3E4; color: var(--bg); }

  .path-note{
    margin-top: 2rem;
    font-family: var(--font-display);
    font-size: 0.8rem;
    color: var(--text-muted);
  }
</style>
</head>
<body>

  <div class="wrap">
    <span class="eyebrow">Connection failed</span>

    <svg class="diagram" viewBox="0 0 220 100" role="img" aria-labelledby="diagram-title">
      <title id="diagram-title">A broken connection between two system nodes</title>

      <path class="link-line" d="M50,50 L170,50"></path>

      <rect class="node" x="20" y="34" width="60" height="32" rx="3"></rect>
      <text class="node-label" x="50" y="54" text-anchor="middle">This site</text>

      <rect class="node broken" x="140" y="34" width="60" height="32" rx="3"></rect>
      <text class="node-label" x="170" y="54" text-anchor="middle">That page</text>

      <line class="x-mark" x1="100" y1="42" x2="120" y2="58"></line>
      <line class="x-mark" x1="120" y1="42" x2="100" y2="58"></line>
    </svg>

    <h1>404</h1>
    <p class="lede">
      This route didn't resolve. Either the page moved, the link's outdated,
      or someone typo'd a URL - the usual suspects in any broken integration.
    </p>

    <a class="btn" href="https://derksen-sam.github.io/derksen-sam">Back to home</a>

    <p class="path-note">No retry logic on this one - just the link above.</p>
  </div>

</body>
</html>
