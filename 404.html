<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%230B2942'/><circle cx='16' cy='16' r='8' fill='%235EEAD4'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="styles.css">
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
</noscript>
<title>404 - Node not found</title>
<meta name="description" content="Page not found.">
</head>
<body>

  <div class="nf-wrap">
    <span class="nf-eyebrow">Connection failed</span>

    <svg class="nf-diagram" viewBox="0 0 220 100" role="img" aria-labelledby="diagram-title">
      <title id="diagram-title">A broken connection between two system nodes</title>

      <path class="link-line" d="M50,50 L170,50"></path>

      <rect class="node" x="20" y="34" width="60" height="32" rx="3"></rect>
      <text class="node-label" x="50" y="54" text-anchor="middle">This site</text>

      <rect class="node broken" x="140" y="34" width="60" height="32" rx="3"></rect>
      <text class="node-label" x="170" y="54" text-anchor="middle">That page</text>

      <line class="x-mark" x1="100" y1="42" x2="120" y2="58"></line>
      <line class="x-mark" x1="120" y1="42" x2="100" y2="58"></line>
    </svg>

    <h1>404</h1>
    <p class="nf-lede">
      This route didn't resolve. Either the page moved, the link's outdated,
      or someone typo'd a URL - the usual suspects in any broken integration.
    </p>

    <a class="nf-btn" href="https://derksen-sam.github.io/derksen-sam">Back to home</a>

    <p class="nf-path-note">No retry logic on this one - just the link above.</p>
  </div>

</body>
</html>
